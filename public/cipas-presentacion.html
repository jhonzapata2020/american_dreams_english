              </div>
            </div>

            <div class="p-3.5 rounded-2xl bg-slate-800/70 border border-slate-700 flex items-start gap-3">
              <span class="text-lg">🛠️</span>
              <div>
                <h5 class="text-xs font-black text-slate-200">2. Aprende Git y GitHub desde el primer semestre</h5>
                <p class="text-xs text-slate-400">Tu repositorio de GitHub es tu verdadero currículum y carta de presentación ante la industria global.</p>
              </div>
            </div>

            <div class="p-3.5 rounded-2xl bg-slate-800/70 border border-slate-700 flex items-start gap-3">
              <span class="text-lg">🤝</span>
              <div>
                <h5 class="text-xs font-black text-slate-200">3. Únete a semilleros de investigación como GRUSLIN</h5>
                <p class="text-xs text-slate-400">El trabajo en equipo, las publicaciones y los proyectos reales te abrirán puertas antes de graduarte.</p>
              </div>
            </div>
          </div>
        `
      },

      // SLIDE 11: SESIÓN DE PREGUNTAS
      {
        badge: "Participación & Diálogo",
        title: "Sesión de Preguntas y Respuestas (Q&A)",
        subtitle: "Resolvamos inquietudes sobre la materia y el desarrollo moderno",
        content: `
          <div class="text-center my-auto space-y-4">
            <div class="w-20 h-20 mx-auto rounded-3xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-3xl">
              💬
            </div>
            <div class="space-y-1">
              <h4 class="text-lg font-black text-slate-100">¡Micrófonos y Chat Abiertos!</h4>
              <p class="text-xs text-slate-400 max-w-md mx-auto">
                Levanta tu mano en Teams o deja tu pregunta en el chat sobre la asignatura Fundamentos de Programación, Supabase o buenas prácticas.
              </p>
            </div>
            <div class="p-3 bg-slate-800/60 rounded-xl inline-block text-xs font-mono text-amber-400 border border-slate-700">
              Teams: 350 Estudiantes Conectados
            </div>
          </div>
        `
      },

      // SLIDE 12: CIERRE Y DESPEDIDA
      {
        badge: "Cierre de la Sesión",
        title: "¡Gracias por su Participación!",
        subtitle: "Universidad Nacional Abierta y a Distancia · UNAD ECBTI",
        content: `
          <div class="text-center my-auto space-y-5">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-slate-950 font-black text-2xl shadow-xl">
              UNAD
            </div>
            <div class="space-y-1">
              <h4 class="text-base sm:text-xl font-black text-slate-100">
                "La tecnología también construye un mejor mañana"
              </h4>
              <p class="text-xs text-slate-400">
                Semillero de Investigación GRUSLIN · Dirección de Curso Fundamentos de Programación
              </p>
            </div>
            <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl max-w-sm mx-auto text-xs text-slate-300 space-y-1">
              <p class="font-bold text-amber-400">H-Estudiante · Facilitador CIPAS</p>
              <p class="text-[11px] text-slate-500">Ciencia que transforma realidades</p>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;
    let timerSeconds = 0;

    // Cronómetro de la sesión
    setInterval(() => {
      timerSeconds++;
      const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const secs = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('sessionTimer').textContent = `${mins}:${secs}`;
    }, 1000);

    function renderSlide() {
      const slide = slides[currentSlide];
      document.getElementById('currentSlideNum').textContent = currentSlide + 1;
      document.getElementById('totalSlidesNum').textContent = slides.length;

      const container = document.getElementById('slideContent');
      container.classList.remove('slide-enter');
      void container.offsetWidth; // Trigger reflow
      container.classList.add('slide-enter');

      container.innerHTML = `
        <div class="space-y-1 text-left">
          <span class="inline-block px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[11px] font-black uppercase tracking-wider">
            ${slide.badge}
          </span>
          <h2 class="text-xl sm:text-3xl font-black text-slate-100 tracking-tight leading-tight mt-1">
            ${slide.title}
          </h2>
          <p class="text-xs sm:text-sm text-slate-400 font-medium">
            ${slide.subtitle}
          </p>
        </div>

        <div class="my-auto py-2">
          ${slide.content}
        </div>

        <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-500 font-mono">
          <span>Semillero GRUSLIN · ECBTI</span>
          <span>Presiona [Espacio] o flechas para avanzar</span>
        </div>
      `;

      document.getElementById('btnPrev').disabled = currentSlide === 0;
      document.getElementById('btnNext').textContent = currentSlide === slides.length - 1 ? 'Finalizar' : 'Siguiente →';
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function copySqlScript() {
      const code = document.getElementById('sqlCodeBlock').innerText;
      navigator.clipboard.writeText(code);
      alert('¡Script SQL copiado al portapapeles!');
    }

    function copyPromptMaster() {
      const code = document.getElementById('promptCodeBlock').innerText;
      navigator.clipboard.writeText(code);
      alert('¡Prompt copiado al portapapeles!');
    }

    // Atajos de teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    renderSlide();
  </script>
</body>
</html>
